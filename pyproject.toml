[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caltools"
version = "0.1.0"
description = "Command line tools for working with a CalDAV calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["caldav>=2", "icalendar>=6"]

[project.scripts]
caltools = "caltools.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["caltools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
